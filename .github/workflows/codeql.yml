name: "CodeQL"

on:
    push:
        branches: ["main", "develop"]
    pull_request:
        branches: ["main", "develop"]
    schedule:
        - cron: "30 1 * * 0"

jobs:
    analyze:
        name: Analyze
        runs-on: ubuntu-latest
        permissions:
            actions: read
            contents: read
            security-events: write

        strategy:
            fail-fast: false
            matrix:
                language: ["rust"]

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Initialize CodeQL
              uses: github/codeql-action/init@v3
              with:
                  languages: ${{ matrix.language }}
                  # CodeQL supports Rust natively now, but sometimes providing a build command is safer
                  # We'll rely on autobuild first as it handles standard cargo projects well

            - name: Autobuild
              uses: github/codeql-action/autobuild@v3

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@v3
              with:
                  category: "/language:${{ matrix.language }}"
