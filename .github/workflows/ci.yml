name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  # Decide whether this change can possibly affect the build.
  #
  # Every job below used to run on every pull request, so a one-file
  # documentation change spent about 45 minutes of runner time compiling Rust on
  # three platforms to prove that Markdown had not broken it.
  #
  # This is deliberately *not* `paths-ignore` on the workflow trigger. With
  # `paths-ignore` the workflow does not run at all, so its checks never report
  # — and the day someone turns on branch protection with required checks, every
  # docs PR becomes permanently unmergeable, waiting on a check that will never
  # arrive. Gating each job with `if:` instead means the jobs still exist and
  # report a `skipped` conclusion, which branch protection accepts.
  #
  # It also fails **safe**: anything it cannot classify — an unreadable diff, a
  # force push, a first push with no `before` commit — is treated as a code
  # change and runs the full suite. The only way to skip is to positively
  # establish that every changed path is documentation.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify changed paths
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail

          if [ "$EVENT" = "pull_request" ]; then
            git fetch -q --no-tags origin "$BASE_REF" || true
            range="origin/$BASE_REF...HEAD"
          elif [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="$BEFORE..$SHA"
          else
            echo "no usable diff range; running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! files=$(git diff --name-only "$range"); then
            echo "could not diff $range; running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -z "$files" ]; then
            echo "empty diff; running everything"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::group::changed files"
          echo "$files"
          echo "::endgroup::"

          # Note what is NOT in this allowlist: .github/workflows/** is code as
          # far as CI is concerned, because a workflow edit is exactly the kind
          # of change that needs the full suite to prove itself.
          docs_only=true
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              *.md|docs/*|LICENSE*|.github/ISSUE_TEMPLATE/*) ;;
              *) docs_only=false; echo "code path: $f" ;;
            esac
          done <<< "$files"

          if [ "$docs_only" = true ]; then
            echo "documentation only — skipping build, test and audit jobs"
            echo "code=false" >> "$GITHUB_OUTPUT"
          else
            echo "code=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    name: Fast Checks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Every job is bounded. The default is six hours, which is not a timeout so
    # much as an absence of one — a stuck job held a runner all night and the
    # only signal was a check that never reported.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # WebKitGTK for the Tauri desktop crate. The winit/wayland/xkb
          # packages the egui GUI needed went away with it.
          #
          # Wrapped in a bounded retry because this step has hung outright: on
          # 2026-08-19 four Linux jobs sat in `apt-get` for six hours each while
          # the identical step on a sibling runner finished in five minutes.
          # apt has no timeout of its own, so a stalled mirror burns the whole
          # job budget and reports nothing.
          #
          # noninteractive so a package that wants to ask something fails rather
          # than waiting forever for an answer nobody can give.
          #
          # `timeout -k 30`, and a `dpkg --configure -a` before each retry,
          # because the retry as first written could not work. Plain `timeout`
          # sends SIGTERM, which apt and dpkg deliberately ignore in the middle
          # of a transaction so a half-configured package is never left behind —
          # so the timeout fired, apt kept running, and when it was finally
          # killed it left `/var/lib/dpkg/lock` held and the transaction
          # unfinished. Attempts 2 and 3 then failed deterministically on the
          # lock: three attempts that were really one. `-k 30` follows up with
          # SIGKILL, and `dpkg --configure -a` finishes whatever the kill
          # interrupted so the next attempt starts from a clean database.
          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do
            echo "::group::apt attempt $attempt"
            if [ "$attempt" -gt 1 ]; then
              sudo -E dpkg --configure -a || true
            fi
            if timeout -k 30 240 sudo -E apt-get update \
               && timeout -k 30 420 sudo -E apt-get install -y \
                 libgtk-3-dev libwebkit2gtk-4.1-dev \
                 libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "apt attempt $attempt failed or timed out"
            sleep $((attempt * 15))
          done
          echo "::error::apt-get failed three times; this is an infrastructure problem, not the diff"
          exit 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `core/fuzz` declares its own workspace on purpose (a sanitizer build
      # must not land in the path of an ordinary `cargo build`), which means
      # `--workspace` above does not reach it. Nothing did: the fuzz targets
      # were not compiled, formatted or linted by CI at all, so renaming
      # `sanitize_filename` would have broken all of them with nothing turning
      # red — and a fuzz target that no longer builds is one nobody runs.
      #
      # `cargo check`, not `cargo fuzz`: this needs neither nightly nor a
      # sanitizer, because the question is only whether the targets still
      # compile against the code they are meant to be fuzzing.
      - name: Format (fuzz targets)
        run: cargo fmt --manifest-path core/fuzz/Cargo.toml --all -- --check

      - name: Check fuzz targets compile
        run: cargo check --manifest-path core/fuzz/Cargo.toml --all-targets

      - name: Lint (fuzz targets)
        run: cargo clippy --manifest-path core/fuzz/Cargo.toml --all-targets -- -D warnings

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    # Generous: the workspace's end-to-end tests are genuinely networked and the
    # Windows leg is the slowest. Locally the full suite is around six minutes.
    timeout-minutes: 60
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # WebKitGTK for the Tauri desktop crate. The winit/wayland/xkb
          # packages the egui GUI needed went away with it.
          #
          # Wrapped in a bounded retry because this step has hung outright: on
          # 2026-08-19 four Linux jobs sat in `apt-get` for six hours each while
          # the identical step on a sibling runner finished in five minutes.
          # apt has no timeout of its own, so a stalled mirror burns the whole
          # job budget and reports nothing.
          #
          # noninteractive so a package that wants to ask something fails rather
          # than waiting forever for an answer nobody can give.
          #
          # `timeout -k 30`, and a `dpkg --configure -a` before each retry,
          # because the retry as first written could not work. Plain `timeout`
          # sends SIGTERM, which apt and dpkg deliberately ignore in the middle
          # of a transaction so a half-configured package is never left behind —
          # so the timeout fired, apt kept running, and when it was finally
          # killed it left `/var/lib/dpkg/lock` held and the transaction
          # unfinished. Attempts 2 and 3 then failed deterministically on the
          # lock: three attempts that were really one. `-k 30` follows up with
          # SIGKILL, and `dpkg --configure -a` finishes whatever the kill
          # interrupted so the next attempt starts from a clean database.
          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do
            echo "::group::apt attempt $attempt"
            if [ "$attempt" -gt 1 ]; then
              sudo -E dpkg --configure -a || true
            fi
            if timeout -k 30 240 sudo -E apt-get update \
               && timeout -k 30 420 sudo -E apt-get install -y \
                 libgtk-3-dev libwebkit2gtk-4.1-dev \
                 libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "apt attempt $attempt failed or timed out"
            sleep $((attempt * 15))
          done
          echo "::error::apt-get failed three times; this is an infrastructure problem, not the diff"
          exit 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # nextest runs each test in its own process, which is what the workspace
      # is actually written for: the relay tests read a process-global
      # environment variable (`P2PEM_NO_HOLEPUNCH`), and several bind loopback
      # listeners. Under a shared-process runner those only behave because the
      # tests take a mutex around them; here they are isolated by construction.
      # It is also roughly twice as fast, and reports a hung test instead of
      # blocking the job until the workflow timeout.
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run Tests
        run: cargo nextest run --workspace

      # nextest does not run doctests, so they get their own step rather than
      # quietly disappearing from CI.
      - name: Run Doctests
        run: cargo test --workspace --doc

  frontend:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Frontend Build
    # The frontend ships inside a desktop app built for all three platforms, so
    # testing it on one is testing the wrong thing. Vite resolves paths, and the
    # suite touches `localStorage`, timezone-dependent formatting and file-name
    # handling — all places where Windows and macOS differ from Linux in ways
    # that only show up when you run there.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 20
    env:
      # Park Playwright's browsers inside the workspace rather than in each
      # platform's own cache directory, so the cache step below needs one path
      # instead of a three-way conditional.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: desktop

      # Advisories in the npm tree were caught by nothing: `cargo-deny` covers
      # the Rust half and there was no equivalent for the half that actually
      # renders the UI. Scoped to production dependencies and to `high` — the
      # dev tree pulls a long tail of build tooling whose advisories are not
      # reachable from the shipped bundle, and failing on those trains people to
      # ignore the job.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high
        working-directory: desktop

      # Errors only; the config keeps `exhaustive-deps` as a warning on purpose,
      # so this gates on the rules that catch bugs rather than on style debt.
      # Added after a duplicate-prop bug reached CI that a default lint rule
      # would have caught on save.
      - name: Lint
        run: npm run lint
        working-directory: desktop

      - name: Test
        run: npm test
        working-directory: desktop

      - name: Build
        run: npm run build
        working-directory: desktop

      # Everything above this line tests pieces. None of it notices if the
      # assembled app fails to come up — which is how a CSP change that left
      # every screen blank passed all of it. The smoke tests load the real page
      # in a real browser and check that it paints; see desktop/smoke/.
      #
      # Chromium only, cached on the lockfile (which pins @playwright/test to an
      # exact version, so a bump invalidates it).
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.playwright-browsers
          key: playwright-${{ runner.os }}-${{ hashFiles('desktop/package-lock.json') }}

      # `npm run`, not `npx`, so the *runner* is the exact version
      # `package-lock.json` pins and `npm ci` installed — npx falls back to
      # fetching from the registry and running lifecycle scripts when a binary
      # is missing locally, and a CI step that could silently fetch and execute
      # an unpinned package is worth not having at all.
      #
      # To be clear about what this step does do: `playwright install
      # --with-deps chromium` **downloads a browser** and, on Linux, shells out
      # to `apt-get` as root for its shared libraries. An earlier version of
      # this comment claimed "nothing here should ever touch the network", which
      # was true of the runner and not of the command it was attached to. That
      # made it the one apt call in this workflow with no timeout around it —
      # exactly the hang the retries elsewhere exist for. Bounded here, and
      # skipped entirely when the browser cache above hit.
      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "::group::playwright install attempt $attempt"
            if timeout -k 30 600 npm run smoke:install; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "playwright install attempt $attempt failed or timed out"
            sleep $((attempt * 15))
          done
          echo "::error::playwright install failed three times; this is an infrastructure problem, not the diff"
          exit 1
        working-directory: desktop

      - name: Smoke test
        run: npm run smoke
        working-directory: desktop

      # Only on failure: the screenshots and the recorded console/CSP output are
      # the whole point of the job when it goes red, and a blank-page bug is
      # very hard to diagnose from a log line alone.
      - name: Upload smoke test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report-${{ matrix.os }}
          path: |
            desktop/playwright-report/
            desktop/test-results/
          retention-days: 7

  build-verification:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          # WebKitGTK for the Tauri desktop crate. The winit/wayland/xkb
          # packages the egui GUI needed went away with it.
          #
          # Wrapped in a bounded retry because this step has hung outright: on
          # 2026-08-19 four Linux jobs sat in `apt-get` for six hours each while
          # the identical step on a sibling runner finished in five minutes.
          # apt has no timeout of its own, so a stalled mirror burns the whole
          # job budget and reports nothing.
          #
          # noninteractive so a package that wants to ask something fails rather
          # than waiting forever for an answer nobody can give.
          #
          # `timeout -k 30`, and a `dpkg --configure -a` before each retry,
          # because the retry as first written could not work. Plain `timeout`
          # sends SIGTERM, which apt and dpkg deliberately ignore in the middle
          # of a transaction so a half-configured package is never left behind —
          # so the timeout fired, apt kept running, and when it was finally
          # killed it left `/var/lib/dpkg/lock` held and the transaction
          # unfinished. Attempts 2 and 3 then failed deterministically on the
          # lock: three attempts that were really one. `-k 30` follows up with
          # SIGKILL, and `dpkg --configure -a` finishes whatever the kill
          # interrupted so the next attempt starts from a clean database.
          export DEBIAN_FRONTEND=noninteractive
          for attempt in 1 2 3; do
            echo "::group::apt attempt $attempt"
            if [ "$attempt" -gt 1 ]; then
              sudo -E dpkg --configure -a || true
            fi
            if timeout -k 30 240 sudo -E apt-get update \
               && timeout -k 30 420 sudo -E apt-get install -y \
                 libgtk-3-dev libwebkit2gtk-4.1-dev \
                 libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "apt attempt $attempt failed or timed out"
            sleep $((attempt * 15))
          done
          echo "::error::apt-get failed three times; this is an infrastructure problem, not the diff"
          exit 1

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked

  # Supply chain: advisories, licences, and sources. The accepted-risk list lives
  # in deny.toml, where each entry names the crate and the path that reaches it.
  # Gating on this in CI is what stops that list from quietly going stale — a
  # leftover entry suppresses findings on a crate we may now use differently.
  supply-chain:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    name: Supply Chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # `--all-features` so the check covers every target's dependency set, not
      # just the default one for this runner.
      - name: cargo-deny
        run: cargo deny --all-features check

      # deny.toml's own comment says a stale acceptance is worse than no
      # acceptance, because it suppresses a real future finding on a crate we
      # have since started using differently. Nothing enforced that, and an
      # accept-list only ever grows. cargo-deny has no built-in report for
      # unused advisory ignores, so this derives it.
      - name: Accepted advisories are still applicable
        run: ./scripts/check-stale-advisories.sh

      # The gitleaks binary directly, not gitleaks-action: that action exits 1
      # even when its own SARIF reports `"results": []` (it gates on a licence
      # key), which would make this job a permanent red herring. Running the
      # scanner itself means the exit code means what it says.
      # Pinned to the version this was verified against, straight from the
      # upstream release. (taiki-e/install-action does not carry gitleaks.)
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Full history: a secret that was committed and later removed is still
      # published, so scanning only the diff would miss the case that matters.
      - name: Secret scan
        run: gitleaks detect --no-banner --redact --verbose

