name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Fast Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # WebKitGTK for the Tauri desktop crate. The winit/wayland/xkb
          # packages the egui GUI needed went away with it.
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Unit Tests
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # WebKitGTK for the Tauri desktop crate. The winit/wayland/xkb
          # packages the egui GUI needed went away with it.
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Run Tests
        run: cargo test --workspace

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: desktop

      - name: Test
        run: npm test
        working-directory: desktop

      - name: Build
        run: npm run build
        working-directory: desktop

  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # WebKitGTK for the Tauri desktop crate. The winit/wayland/xkb
          # packages the egui GUI needed went away with it.
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev librsvg2-dev libayatana-appindicator3-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --locked

  # Supply chain: advisories, licences, and sources. The accepted-risk list lives
  # in deny.toml, where each entry names the crate and the path that reaches it.
  # Gating on this in CI is what stops that list from quietly going stale — a
  # leftover entry suppresses findings on a crate we may now use differently.
  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      # `--all-features` so the check covers every target's dependency set, not
      # just the default one for this runner.
      - name: cargo-deny
        run: cargo deny --all-features check

      # The gitleaks binary directly, not gitleaks-action: that action exits 1
      # even when its own SARIF reports `"results": []` (it gates on a licence
      # key), which would make this job a permanent red herring. Running the
      # scanner itself means the exit code means what it says.
      # Pinned to the version this was verified against, straight from the
      # upstream release. (taiki-e/install-action does not carry gitleaks.)
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Full history: a secret that was committed and later removed is still
      # published, so scanning only the diff would miss the case that matters.
      - name: Secret scan
        run: gitleaks detect --no-banner --redact --verbose

