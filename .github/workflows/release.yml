name: Release

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

# One product, one obvious download.
#
# Releases used to attach two different desktop apps — the egui binary (via Inno
# Setup / a hand-rolled .app / a tarball) *and* the Tauri installers — with
# nothing on the page saying which to install, and the older egui one looking
# like the default. The egui GUI has since been deleted (see docs/platform_spec.md
# §10, phase E), so this pipeline publishes:
#
#   1. P2PEM Desktop  — the app. Real installers from Tauri's bundler.
#   2. P2PEM Tools    — terminal client + relay + community server, for people
#                       running this on a headless box. Clearly secondary.
#
# The release body is written first, so the page explains itself the moment the
# artifacts start landing.
jobs:
  create-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compose release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "## Download"
            echo
            echo "**[P2PEM Desktop](#assets) — this is the app.** Pick the installer for your system:"
            echo
            echo "| System | File |"
            echo "|---|---|"
            echo "| Windows | \`P2PEM_${VERSION}_x64-setup.exe\` (or the \`.msi\`) |"
            echo "| macOS (Apple silicon) | \`P2PEM_${VERSION}_aarch64.dmg\` |"
            echo "| macOS (Intel) | \`P2PEM_${VERSION}_x64.dmg\` |"
            echo "| Linux | \`P2PEM_${VERSION}_amd64.AppImage\` (portable) or \`.deb\` |"
            echo
            echo "Not sure? Take the Windows \`.exe\`, the macOS \`.dmg\` matching your chip, or the Linux \`.AppImage\`."
            echo
            echo "<details><summary>Running a server, or prefer a terminal?</summary>"
            echo
            echo "\`P2PEM-Tools_${VERSION}_<os>.tar.gz\` contains the terminal client (\`p2pem\`,"
            echo "which also runs a relay with \`--relay-server\`) and the community server"
            echo "(\`p2pem-server\`). You do **not** need these to use the desktop app."
            echo
            echo "</details>"
            echo
            echo "> First launch creates an identity and asks for a password that encrypts it."
            echo "> There is no account and no password reset — export a backup when prompted."
            echo
            echo "<details><summary>Verify your download</summary>"
            echo
            echo "These installers are **not** signed with an OS code-signing certificate, so"
            echo "Windows SmartScreen and macOS Gatekeeper will warn about them. That warning"
            echo "is about a missing certificate, not about the contents — so here is how to"
            echo "check the contents directly."
            echo
            echo "**Provenance** — proves the file was built by this repository's release"
            echo "workflow, from this commit, and not by anyone else. Needs the \`gh\` CLI:"
            echo
            echo "\`\`\`"
            echo "gh attestation verify <downloaded-file> --repo ${GITHUB_REPOSITORY}"
            echo "\`\`\`"
            echo
            echo "**Checksums** — proves the bytes you got are the bytes that were published."
            echo "Download \`SHA256SUMS\` from the assets below, then:"
            echo
            echo "\`\`\`"
            echo "sha256sum --ignore-missing -c SHA256SUMS      # Linux"
            echo "shasum -a 256 --ignore-missing -c SHA256SUMS  # macOS"
            echo "\`\`\`"
            echo
            echo "Provenance is the stronger of the two: a checksum only proves the file"
            echo "matches this page, while an attestation proves this page's file came from"
            echo "the source you can read."
            echo
            echo "</details>"
            echo
            echo "---"
          } > release-notes.md

      - name: Ensure release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists; leaving its notes alone."
          else
            gh release create "${{ github.ref_name }}" \
              --repo "${{ github.repository }}" \
              --target "${{ github.sha }}" \
              --title "P2PEM ${{ github.ref_name }}" \
              --notes-file release-notes.md \
              --generate-notes
          fi

  # ── The app ───────────────────────────────────────────────────────────────
  desktop:
    name: P2PEM Desktop (${{ matrix.label }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            label: windows-x64
            args: ''
          - platform: macos-latest
            label: macos-aarch64
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            label: macos-x64
            args: '--target x86_64-apple-darwin'
          # 22.04 keeps the glibc baseline low so the bundles run on older distros.
          - platform: ubuntu-22.04
            label: linux-x64
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwayland-dev libxkbcommon-dev \
            libwebkit2gtk-4.1-dev libsoup-3.0-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ contains(matrix.args, 'apple') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend dependencies
        run: npm ci
        working-directory: desktop

      # The webview loads whatever is in desktop/dist; building it here means a
      # stale committed bundle can never ship in a release.
      - name: Build frontend
        run: npm run build
        working-directory: desktop

      - name: Build and upload desktop installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'P2PEM ${{ github.ref_name }}'
          args: ${{ matrix.args }}

  # ── Secondary: headless / self-hosting tools ──────────────────────────────
  tools:
    name: P2PEM Tools (${{ matrix.label }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x64
          - os: macos-latest
            label: macos
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # No GUI toolkit is needed any more: the client crate is the app core plus
      # a terminal UI, and the server is headless.
      - name: Build
        run: cargo build --release --locked -p p2pem-classic -p messenger-server

      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          STAGE="P2PEM-Tools_${VERSION}_${{ matrix.label }}"
          mkdir -p "$STAGE"
          # Binary names, not package names: the `messenger-server` package
          # declares `[[bin]] name = "server"`.
          cp target/release/p2pem-classic "$STAGE/p2pem"
          cp target/release/server "$STAGE/p2pem-server"
          cp README.md LICENSE.md "$STAGE/"
          cp docs/USER_GUIDE.md "$STAGE/" 2>/dev/null || true
          tar -czf "${STAGE}.tar.gz" "$STAGE"
          echo "ASSET=${STAGE}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $stage = "P2PEM-Tools_${version}_${{ matrix.label }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/p2pem-classic.exe "$stage/p2pem.exe"
          Copy-Item target/release/server.exe "$stage/p2pem-server.exe"
          Copy-Item README.md, LICENSE.md $stage
          if (Test-Path docs/USER_GUIDE.md) { Copy-Item docs/USER_GUIDE.md $stage }
          Compress-Archive -Path $stage -DestinationPath "$stage.zip" -Force
          "ASSET=$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" "$ASSET" --repo "$GITHUB_REPOSITORY" --clobber
        shell: bash


  # ── Provenance and checksums ──────────────────────────────────────────────
  #
  # These installers carry no OS code-signing certificate — a Windows
  # Authenticode cert and an Apple Developer membership are recurring costs this
  # project does not carry. That is a deliberate choice, and it is worth being
  # precise about what it does and does not cost the user: SmartScreen and
  # Gatekeeper will warn, but the warning is about a *missing certificate*, not
  # about the contents. What a certificate would actually prove — that the file
  # came from this project and has not been altered — is proved here instead,
  # for free, and arguably better.
  #
  #   SHA256SUMS   proves the bytes you downloaded match the bytes published.
  #                Cheap, familiar, and no help at all if the release page
  #                itself is what an attacker controls.
  #   Provenance   binds each artifact's digest to this repository, this commit
  #                and this workflow run, signed through Sigstore with an
  #                ephemeral key and recorded in a public transparency log.
  #                Free for public repositories. `gh attestation verify` checks
  #                it, and it is the claim that actually matters: not "these are
  #                the bytes on the page" but "these are the bytes this source
  #                built".
  #
  # Run as one job after everything has been published, rather than per build
  # job: it covers every asset regardless of which of the seven matrix legs
  # produced it, and it does not need the four desktop runners to agree on how
  # to parse tauri-action's artifact paths.
  attest:
    name: Provenance and checksums
    needs: [desktop, tools]
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow-level block rather than adding
    # to it, so `contents` has to be restated here.
    permissions:
      contents: write # upload SHA256SUMS to the release
      id-token: write # mint the short-lived Sigstore signing certificate
      attestations: write # record the attestation against this repository
    steps:
      - name: Download every published asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --dir assets
          # A SHA256SUMS from an earlier run of the same tag must not be hashed
          # into the new one, and must not be attested as a build artifact.
          rm -f assets/SHA256SUMS
          ls -l assets

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'assets/*'

      - name: Publish SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Hashes are recorded with bare filenames, so `-c` works from whatever
          # directory the user downloaded into.
          (cd assets && sha256sum -- *) > SHA256SUMS
          cat SHA256SUMS
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --clobber
