# cargo-deny configuration (schema v2, cargo-deny >= 0.16).
# Vulnerabilities, unmaintained crates, unsound advisories, and yanked crates
# are all errors by default under v2 — no per-category severity keys anymore.

[advisories]
version = 2
# Temporary risk acceptances tracked in GitHub issues and SECURITY.md.
# Keep this list minimal and review regularly.
# Every entry names the crate and the path that reaches it. A stale entry is
# worse than no entry — it silently suppresses a future finding on a crate we
# have since started using differently — so entries are removed as soon as the
# dependency goes away. This is now *enforced*, not just asked for:
# `scripts/check-stale-advisories.sh` runs in CI and fails on any entry that no
# longer matches a firing advisory. Retiring the egui GUI dropped `epaint`/`ttf-parser` and
# the `image` AVIF chain, and those entries went with it.
# Verify a claim before adding one: `cargo tree --workspace --target all -i <crate>`.
ignore = [
    "RUSTSEC-2023-0071", # rsa Marvin timing issue. No upstream fix. Used for
                         # RSA-PSS *signatures* only; this app performs no RSA
                         # decryption, which is what the attack targets.
    "RUSTSEC-2024-0436", # paste unmaintained (transitive, proc-macro/build-time)
    "RUSTSEC-2025-0141", # bincode unmaintained (direct in core, migration pending)
    # RUSTSEC-2024-0411 through -0420 (the gtk-rs GTK3 binding family: gtk,
    # gdk, atk, gtk-sys, gdk-sys, atk-sys, gdkx11, gdkx11-sys, gdkwayland-sys,
    # gtk3-macros) were accepted here as unmaintained. All ten were **withdrawn
    # upstream on 2026-08-14** and no longer exist as findings, so the entries
    # were removed on 2026-09-09.
    #
    # The crates themselves are still in the tree, unchanged — they reach us
    # through Tauri's Linux backend (muda / tao -> tauri-runtime-wry). Nothing
    # about our dependencies changed; the advisories did. Should RustSec
    # reinstate them, they will fire again and want a fresh entry with a reason
    # written at that time, which is the whole point of not leaving dead ones
    # here.
    "RUSTSEC-2024-0370", # proc-macro-error unmaintained (transitive, build-time only)
    "RUSTSEC-2025-0075", # unic-* family unmaintained (transitive)
    "RUSTSEC-2025-0080",
    "RUSTSEC-2025-0081",
    "RUSTSEC-2025-0098",
    "RUSTSEC-2025-0100",
    # quick-xml DoS-class issues (quadratic dup-attribute check / unbounded
    # NsReader allocation). The vulnerable 0.39.4 is reachable ONLY via
    # rfd -> wayland-client/protocols -> wayland-scanner, which is a proc macro:
    # it parses the Wayland protocol XML vendored inside the crate, at build
    # time, and is never linked into the shipped binary. The input is neither
    # attacker-controlled nor present at runtime. Our own Tauri path already
    # resolves the fixed 0.41.0.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
version = 2
# v2 is allow-list only: anything not listed here fails the check (so GPL/AGPL
# and friends are denied implicitly).
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
    "NCSA",
    "Apache-2.0 WITH LLVM-exception",
]

# No exceptions. The one that used to live here covered egui's bundled fonts
# (`epaint_default_fonts`, Ubuntu Font License as a custom LicenseRef) and went
# away with the egui GUI.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
skip-tree = []

[sources]
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
