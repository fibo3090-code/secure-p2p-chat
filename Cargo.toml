[workspace]
resolver = "2"
members = ["core", "client", "server", "desktop/src-tauri"]
# Bare `cargo build`/`test`/`run` target the client app (the default product);
# use `--workspace` (CI) or `-p messenger-server` to include the server.
default-members = ["client"]

[workspace.package]
version = "1.16.2"
edition = "2021"
rust-version = "1.89"
authors = ["fibo3090 <fibo3090@example.com>"]
license = "MIT"

[workspace.dependencies]
# Internal crates
messenger-core = { path = "core" }
# Only ever a dev-dependency of the client, so `tests/party_e2e.rs` can stand a
# real Community server up in process. Acyclic: the server depends only on core.
messenger-server = { path = "server" }

# Runtime async
tokio = { version = "1", features = ["full"] }
# TCP keepalive, which tokio does not expose. Already in the tree via tokio, so
# this adds no new compilation — only a direct, declared use of it.
socket2 = "0.6"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Cryptography (RustCrypto)
rsa = "0.9.10"
sha2 = "0.10"
# Constant-time primitives (used for secret comparisons that must not leak
# their match length through timing).
subtle = "2.6"
aes-gcm = "0.11.0"
rand = "0.8.6"
getrandom = "0.4"
x25519-dalek = "2.0"
ed25519-dalek = { version = "3.0", features = ["zeroize"] }
hkdf = "0.12"

# Encodage
hex = "0.4"
base64 = "0.22"

# Logging. The app keeps its own bounded in-process buffer for the log overlay
# and diagnostics bundles (`client/src/logbuf.rs`) — that used to be
# `egui_tracing`, dropped along with the egui GUI.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# CLI
clap = { version = "4", features = ["derive", "env"] }

# TUI
ratatui = { version = "0.30.0", features = ["crossterm_0_29", "underline-color", "all-widgets", "macros", "layout-cache"] }
ratatui-crossterm = { version = "0.1.0", features = ["crossterm_0_29"] }

# Embedded SQLite (bundled: compiles SQLite from source, no system dependency).
#
# The pin here carried a note claiming 0.40 could not be taken because
# libsqlite3-sys 0.38's build script needs the unstable `cfg_select`. That is no
# longer true — 0.38.2's build.rs defines its own `cfg_select!` macro, with the
# comment "Just to keep MSRV low" — and it was doubly stale once the workspace
# floor moved to 1.89. Verified: `cargo check -p messenger-server` against
# rusqlite 0.40.2 succeeds. Left at 0.39 only so the bump lands through its own
# Dependabot PR rather than conflicting with the open lockfile changes; the note
# is gone because a false blocker in a comment is what stops the next person.
rusqlite = { version = "0.40", features = ["bundled"] }

# Utilities
anyhow = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }

# File dialogs
rfd = "0.17.2"

# Open files
open = "5"

# Desktop notifications
notify-rust = "4"

# QR code generation and scanning
qrcode = "0.14.0"
image = "0.25.9"
arboard = "3"
chacha20poly1305 = "0.10.1"

# Local peer discovery (mDNS/Bonjour)
mdns-sd = "0.21"
igd-next = { version = "0.17", features = ["aio_tokio"] }
natpmp = "0.5"
hostname = "0.4"
unicode-width = "0.2"

# Dev / testing
tokio-test = "0.4"
tempfile = "3"
proptest = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
