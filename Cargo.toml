[workspace]
resolver = "2"
members = ["core", "client", "server"]
# Bare `cargo build`/`test`/`run` target the client app (the default product);
# use `--workspace` (CI) or `-p messenger-server` to include the server.
default-members = ["client"]

[workspace.package]
version = "1.9.0"
edition = "2021"
rust-version = "1.86"
authors = ["fibo3090 <fibo3090@example.com>"]

[workspace.dependencies]
# Internal crates
messenger-core = { path = "core" }

# Runtime async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1"

# Cryptography (RustCrypto)
rsa = "0.9.10"
sha2 = "0.10"
aes-gcm = "0.10.3"
rand = "0.8"
getrandom = "0.2"
x25519-dalek = "2.0"
ed25519-dalek = { version = "2.1", features = ["zeroize"] }
hkdf = "0.12"

# Encodage
hex = "0.4"
base64 = "0.21"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
egui_tracing = { version = "0.2.6", features = ["egui-default"] }

# CLI
clap = { version = "4", features = ["derive"] }

# GUI
eframe = "0.29.0"
egui = "0.29.0"
egui_commonmark = { version = "0.18", features = ["default"] }

# TUI
ratatui = { version = "0.30.0", features = ["crossterm_0_29", "underline-color", "all-widgets", "macros", "layout-cache"] }
ratatui-crossterm = { version = "0.1.0", features = ["crossterm_0_29"] }

# Utilities
anyhow = "1"
thiserror = "1"
uuid = { version = "1", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
directories = "5"
argon2 = "0.5"
zeroize = { version = "1", features = ["zeroize_derive"] }

# File dialogs
rfd = "0.14.1"

# Open files
open = "5"

# Desktop notifications
notify-rust = "4"

# Emoji support
emojis = "0.6"

# QR code generation and scanning
qrcode = "0.14.0"
image = "0.25.9"
arboard = "3"
chacha20poly1305 = "0.10.1"

# Local peer discovery (mDNS/Bonjour)
mdns-sd = "0.11"
hostname = "0.4"
unicode-width = "0.2"

# Windows-specific
windows-sys = { version = "0.52", features = ["Win32_System_Console", "Win32_Foundation"] }

# Dev / testing
tokio-test = "0.4"
tempfile = "3"
proptest = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
