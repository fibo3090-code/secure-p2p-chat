[package]
name = "messenger-server"
description = "Self-hosted Party/Community server for the Encrypted Messenger: channels, DMs, file sharing, and offline history over the v3 encrypted transport."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
# Reuses the shared core for the encrypted transport handshake (Phase 1+).
messenger-core = { workspace = true }

tokio = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
rsa = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rusqlite = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
