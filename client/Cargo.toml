[package]
name = "p2pem-classic"
description = "Encrypted P2P Messenger - a secure peer-to-peer messaging application with end-to-end encryption and forward secrecy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
name = "p2pem_classic"
path = "src/lib.rs"

[[bin]]
name = "p2pem-classic"
path = "src/main.rs"

[dependencies]
# Shared core (crypto, protocol, identity, transport)
messenger-core = { workspace = true }

# Runtime async
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Encoding
hex = { workspace = true }
base64 = { workspace = true }

# Cryptography (used by persistence + identity-facing UI)
rsa = { workspace = true }
rand = { workspace = true }
chacha20poly1305 = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# CLI
clap = { workspace = true }

# TUI. There is deliberately no GUI toolkit here: the egui desktop GUI was
# retired in favour of the Tauri app in `desktop/`, so this crate is the app
# core plus a terminal interface, and the desktop bridge no longer compiles a
# windowing stack it never uses.
ratatui = { workspace = true }
ratatui-crossterm = { workspace = true }

# Utilities
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
directories = { workspace = true }

# Desktop notifications (the manager raises them; the shell decides when)
notify-rust = { workspace = true }

# QR codes for invite links, rendered to a PNG
qrcode = { workspace = true }
image = { workspace = true }

# Terminal clipboard + width-correct rendering
arboard = { workspace = true }
unicode-width = { workspace = true }

[dev-dependencies]
tokio-test = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }
