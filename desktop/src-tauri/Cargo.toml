[package]
name = "p2pem-desktop"
description = "P2PEM desktop (Tauri + webview) frontend — Phase 1 bridge over the shared core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# The library the binary calls into. Only `rlib`: the `staticlib`/`cdylib`
# types exist for Tauri *mobile* entry points, which this project does not
# ship, and they cost ~1.8 GB of build output per profile (audit DX-03). Add
# them back when mobile work starts.
name = "p2pem_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
log = "0.4"

serde = { workspace = true }
serde_json = { workspace = true }

# App orchestration lives in the client lib (ChatManager, persistence); the
# bridge reuses it directly. ChatManager itself has no UI dependency, but the
# crate also holds the terminal UI, so this pulls in ratatui and its crossterm
# backend transitively (egui is gone; `cargo tree` must show none). Extracting
# the app core into its own crate would drop them from the desktop build.
p2pem-classic = { path = "../../client" }
messenger-core = { workspace = true }

tokio = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
directories = { workspace = true }
# Native file picker for "send file" (sync dialog run on a blocking thread).
rfd = { workspace = true }
open = { workspace = true }
chrono = { workspace = true }
# Inline image previews: file bytes -> data URL for the webview.
base64 = { workspace = true }

# The mock runtime lets tests drive the real command handlers over IPC without
# a display server — this is what CI uses to exercise the bridge headlessly.
# Not on Windows: a Rust test-harness exe linking tauri aborts at startup with
# STATUS_ENTRYPOINT_NOT_FOUND there (it lacks the Windows manifest tauri-build
# embeds into the real app binary), so Windows would fail before running a
# single test. The suite is OS-independent (it exercises IPC arg binding, not
# windowing), so Linux/macOS coverage in CI loses nothing.
[target.'cfg(not(windows))'.dev-dependencies]
tauri = { version = "2.11.3", features = ["test"] }
tempfile = { workspace = true }
